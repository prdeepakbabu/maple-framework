# PRISM Configuration File
# ========================
# All features can be enabled/disabled independently

features:
  memory:
    enabled: true
    storage_path: "./storage/memory"
    retention_days: -1  # -1 = indefinite, positive number = days to keep

  learning:
    enabled: true
    async_mode: false  # Changed to sync - Gradio creates separate event loops
    triggers:
      - end_of_turn
      - explicit_feedback

  personalization:
    enabled: true
    context_budget_tokens: 2000

# LLM Configuration
llm:
  provider: bedrock
  model_id: anthropic.claude-3-5-sonnet-20241022-v2:0
  region: us-west-2
  max_tokens: 4096
  temperature: 0.7

# Tool Configuration
tools:
  search:
    enabled: true
    max_results: 5
  
  filesystem:
    enabled: true
    allowed_paths:
      - "./workspace"
      - "./storage"
  
  code_executor:
    enabled: true
    timeout_seconds: 30
  
  web_fetch:
    enabled: true
    timeout_seconds: 15
    max_content_length: 10000  # Characters to return
    allowed_domains: []  # Empty = all domains allowed

# Logging Configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: structured  # structured or plain
  include_tool_results: true
